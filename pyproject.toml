[project]
name = "online-deal-scouter"
version = "1.0.0"
description = "Autonomous Multi-Agent Deal Hunting & Real-Time Price Prediction Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "chromadb>=0.5.0",
    "datasets>=3.0.0",
    "feedparser>=6.0.11",
    "gradio>=5.0.0",
    "joblib>=1.4.0",
    "modal>=0.64.0",
    "numpy>=1.26.0",
    "openai>=1.50.0",
    "pandas>=2.2.0",
    "plotly>=5.24.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "scikit-learn>=1.5.0",
    "sentence-transformers>=3.0.0",
    "sqlalchemy>=2.0.30",
    "torch>=2.4.0",
    "tqdm>=4.66.0",
    "transformers>=4.44.0",
    "wandb>=0.17.0",
]

[tool.uv]
package = false

[tool.setuptools.packages.find]
include = ["agents*", "database*", "services*", "training*"]
exclude = ["assets*", "docs*", "products_vectorstore*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
